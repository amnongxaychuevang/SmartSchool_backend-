# /etc/nginx/sites-available/edusmart-uat  (link it into sites-enabled)
# Then:  sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d edusmart.phousam.com
# certbot adds the 443 server and the http->https redirect itself.

server {
    listen 80;
    server_name edusmart.phousam.com;

    # Photos and slips up to 5 MB, PDFs and assignments up to 10 MB
    client_max_body_size 12m;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live check-in feed and dashboard updates (Socket.io needs the upgrade headers)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Uploaded photos (served by the API)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
    }

    # Web app
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
