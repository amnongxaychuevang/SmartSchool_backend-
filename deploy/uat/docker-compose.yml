# EduSmart UAT stack: MySQL + API + web, isolated from anything else on the server.
#
# Expected layout on the server (both repos side by side):
#   ~/edusmart-uat/backend    <- this repo (this file is backend/deploy/uat/)
#   ~/edusmart-uat/frontend   <- the frontend repo
#
#   cd ~/edusmart-uat/backend/deploy/uat
#   cp .env.uat.example .env   # fill it in
#   docker compose up -d --build
#
# Ports are bound to 127.0.0.1 only: the host's nginx is the single public entry.
name: edusmart-uat

services:
  db:
    image: mysql:8.4
    container_name: edusmart-uat-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: smart_school
      MYSQL_USER: edusmart
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edusmart]

  api:
    build: ../..
    image: edusmart-api:uat
    container_name: edusmart-uat-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: mysql://edusmart:${DB_PASSWORD}@db:3306/smart_school
      CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      TRUST_PROXY: "1"
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:${API_PORT:-5100}:5000"
    volumes:
      # User files and backups live on the host, so a rebuild never loses them.
      - ./data/uploads:/app/uploads
      - ./data/storage:/app/storage
      - ./data/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [edusmart]

  web:
    build:
      context: ../../../frontend
      args:
        NUXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env}
    image: edusmart-web:uat
    container_name: edusmart-uat-web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL}
      # Server-side rendering talks to the API container directly, not via the public URL
      NUXT_API_INTERNAL_URL: http://api:5000/api
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on: [api]
    networks: [edusmart]

networks:
  edusmart:
    name: edusmart-uat

volumes:
  db_data:
    name: edusmart-uat-db-data
