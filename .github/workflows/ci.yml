name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      # Prisma Client is generated automatically via @prisma/client's own
      # postinstall hook — no DB connection needed for that, and none of
      # the unit tests touch a real database (repositories are mocked).
      - run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm test
